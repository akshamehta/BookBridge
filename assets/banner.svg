<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="BookBridge: lend, borrow, exchange and donate books" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081a2b"/>
      <stop offset="0.55" stop-color="#0d3b4c"/>
      <stop offset="1" stop-color="#14524f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#f6ad3c" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#f6ad3c" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f6ad3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fde7b0"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="b4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#94a3b8"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="round"><rect width="1280" height="340" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#dots)"/>
    <rect width="1280" height="340" fill="url(#glow)"/>

    <!-- twinkling stars -->
    <g fill="#ffffff">
      <circle cx="210" cy="60" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="35" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="45" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="70" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="28" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- bridge: arch, hangers, deck -->
    <path d="M140 300 Q 640 -20 1140 300" fill="none" stroke="url(#arc)" stroke-width="6" stroke-linecap="round"/>
    <path d="M140 300 Q 640 -20 1140 300" fill="none" stroke="url(#arc)" stroke-width="16" stroke-opacity="0.12" stroke-linecap="round"/>
    <g stroke="#fcd34d" stroke-opacity="0.28" stroke-width="2">
      <line x1="240" y1="242" x2="240" y2="300"/><line x1="340" y1="198" x2="340" y2="300"/>
      <line x1="440" y1="166" x2="440" y2="300"/><line x1="540" y1="146" x2="540" y2="300"/>
      <line x1="740" y1="146" x2="740" y2="300"/><line x1="840" y1="166" x2="840" y2="300"/>
      <line x1="940" y1="198" x2="940" y2="300"/><line x1="1040" y1="242" x2="1040" y2="300"/>
    </g>
    <rect x="110" y="298" width="1060" height="8" rx="4" fill="#fcd34d" fill-opacity="0.55"/>

    <!-- standing books on the deck, left and right -->
    <g filter="url(#soft)">
      <g transform="translate(70 232)">
        <rect x="0" y="12" width="26" height="66" rx="3" fill="url(#b4)"/>
        <rect x="30" y="0" width="30" height="78" rx="3" fill="url(#b1)"/>
        <rect x="64" y="18" width="24" height="60" rx="3" fill="url(#b2)"/>
        <rect x="6" y="26" width="14" height="3" rx="1.5" fill="#0f172a" fill-opacity="0.35"/>
        <rect x="36" y="14" width="18" height="3" rx="1.5" fill="#0f172a" fill-opacity="0.35"/>
      </g>
      <g transform="translate(1122 232)">
        <rect x="0" y="16" width="24" height="62" rx="3" fill="url(#b3)"/>
        <rect x="28" y="0" width="32" height="78" rx="3" fill="url(#b2)"/>
        <rect x="64" y="14" width="26" height="64" rx="3" fill="url(#b1)"/>
        <rect x="34" y="14" width="20" height="3" rx="1.5" fill="#0f172a" fill-opacity="0.35"/>
        <rect x="70" y="28" width="14" height="3" rx="1.5" fill="#0f172a" fill-opacity="0.35"/>
      </g>
    </g>

    <!-- floating books (gentle motion) -->
    <g filter="url(#soft)">
      <g transform="translate(220 96) rotate(-14)">
        <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -9;0 0" dur="5s" repeatCount="indefinite"/>
        <rect width="44" height="58" rx="4" fill="url(#b1)"/>
        <rect x="6" y="8" width="26" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.7"/>
        <rect x="6" y="15" width="18" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.5"/>
      </g>
      <g transform="translate(1000 84) rotate(12)">
        <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -11;0 0" dur="6s" repeatCount="indefinite"/>
        <rect width="46" height="60" rx="4" fill="url(#b3)"/>
        <rect x="7" y="9" width="26" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.7"/>
        <rect x="7" y="16" width="18" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.5"/>
      </g>
      <g transform="translate(278 150) rotate(8)">
        <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -7;0 0" dur="4.2s" repeatCount="indefinite"/>
        <rect width="30" height="40" rx="3" fill="url(#b2)"/>
      </g>
      <g transform="translate(972 168) rotate(-9)">
        <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -8;0 0" dur="4.8s" repeatCount="indefinite"/>
        <rect width="30" height="40" rx="3" fill="url(#b4)"/>
      </g>
    </g>

    <!-- title block -->
    <text x="640" y="160" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" letter-spacing="1" fill="#000" fill-opacity="0.25" dx="0" dy="4">BookBridge</text>
    <text x="640" y="160" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" letter-spacing="1" fill="url(#title)">BookBridge</text>
    <text x="640" y="203" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e6f4f1" fill-opacity="0.92" letter-spacing="0.5">Books that keep moving, readers that stay connected</text>

    <!-- action chips -->
    <g font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
      <rect x="392" y="226" width="112" height="38" rx="19" fill="#5eead4" fill-opacity="0.16" stroke="#5eead4" stroke-opacity="0.7"/>
      <text x="448" y="251" fill="#99f6e4">Lend</text>
      <rect x="520" y="226" width="112" height="38" rx="19" fill="#fcd34d" fill-opacity="0.16" stroke="#fcd34d" stroke-opacity="0.7"/>
      <text x="576" y="251" fill="#fde68a">Borrow</text>
      <rect x="648" y="226" width="112" height="38" rx="19" fill="#fdba74" fill-opacity="0.16" stroke="#fdba74" stroke-opacity="0.7"/>
      <text x="704" y="251" fill="#fed7aa">Exchange</text>
      <rect x="776" y="226" width="112" height="38" rx="19" fill="#e2e8f0" fill-opacity="0.14" stroke="#e2e8f0" stroke-opacity="0.6"/>
      <text x="832" y="251" fill="#f1f5f9">Donate</text>
    </g>
  </g>
</svg>
